<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" font-family="Inter, Helvetica, Arial, sans-serif">
  <rect width="1600" height="900" fill="#fdfcfa"/>
  <g stroke="#cfc8be" stroke-width="2" fill="none">
    <path d="M800 200 C800 260 330 250 330 330"/>
    <path d="M800 200 L800 330"/>
    <path d="M800 200 C800 260 1270 250 1270 330"/>
    <path d="M330 440 L330 560"/>
    <path d="M800 440 L800 560"/>
    <path d="M1270 440 L1270 560"/>
  </g>
  <rect x="660" y="110" width="280" height="90" rx="14" fill="#1a1a1a"/>
  <text x="800" y="165" text-anchor="middle" font-size="30" fill="#fdfcfa">Root of the tree</text>
  <g font-size="26" text-anchor="middle">
    <rect x="130" y="330" width="400" height="110" rx="14" fill="#fff" stroke="#e4ded5" stroke-width="2"/>
    <text x="330" y="378" fill="#1a1a1a" font-family="ui-monospace, Menlo, monospace" font-size="24">HasBeenInCombat</text>
    <text x="330" y="412" fill="#1a1a1a" font-family="ui-monospace, Menlo, monospace" font-size="24">ForNSeconds</text>
    <rect x="600" y="330" width="400" height="110" rx="14" fill="#fff" stroke="#e4ded5" stroke-width="2"/>
    <text x="800" y="397" fill="#1a1a1a" font-family="ui-monospace, Menlo, monospace" font-size="24">IsInFog</text>
    <rect x="1070" y="330" width="400" height="110" rx="14" fill="#fff" stroke="#e4ded5" stroke-width="2"/>
    <text x="1270" y="397" fill="#1a1a1a" font-family="ui-monospace, Menlo, monospace" font-size="24">Heard an explosion</text>
    <rect x="130" y="560" width="400" height="110" rx="14" fill="#fde7f1" stroke="#f72585" stroke-width="2"/>
    <text x="330" y="627" fill="#1a1a1a">Conversation</text>
    <rect x="600" y="560" width="400" height="110" rx="14" fill="#fde7f1" stroke="#f72585" stroke-width="2"/>
    <text x="800" y="627" fill="#1a1a1a">Conversation</text>
    <rect x="1070" y="560" width="400" height="110" rx="14" fill="#fde7f1" stroke="#f72585" stroke-width="2"/>
    <text x="1270" y="627" fill="#1a1a1a">Conversation</text>
  </g>
  <text x="800" y="780" text-anchor="middle" font-size="28" fill="#52525b">The tree is walked top to bottom. A conversation plays only if its conditions hold,</text>
  <text x="800" y="820" text-anchor="middle" font-size="28" fill="#52525b">its cooldown is over, and a player is close enough to hear it.</text>
</svg>
